name: Source audit
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
      - run: python -m unittest discover -s tests -v
  published-source:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inventory API catalogue only (not forecasting data)
        run: |
          set -euo pipefail
          python scripts/audit_source.py --catalog-only --out artifacts | tee source-inventory.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aihw-source-inventory
          path: |
            artifacts/
            source-inventory.log
          retention-days: 7
