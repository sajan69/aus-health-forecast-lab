name: Source audit
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
      - run: python -m unittest discover -s tests -v
  published-source:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inventory API catalogue only (not forecasting data)
        run: |
          set -euo pipefail
          python scripts/audit_source.py --catalog-only --out artifacts | tee source-inventory.log
      - name: Inspect published Queensland quarterly DataStore alternative
        run: |
          set -euo pipefail
          python scripts/audit_source.py --qld-only --out qld-artifacts | tee qld-source-inventory.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aihw-source-inventory
          path: |
            artifacts/
            source-inventory.log
            qld-artifacts/
            qld-source-inventory.log
          retention-days: 7
  history-source:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          set -euo pipefail
          python -m scripts.audit_history --out history-artifacts | tee history-inventory.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qld-history-inventory
          path: |
            history-artifacts/
            history-inventory.log
          retention-days: 7

  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      matrix:
        python: ['3.12', '3.13']
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
      - run: |
          set -euo pipefail
          python -m pip install -r requirements.txt
          python -m pip wheel --no-deps . --wheel-dir dist
          python -m pip install --no-deps dist/*.whl
          python -m pip check
          python -m unittest discover -s forecast_tests -v
          aus-health-forecast --version
          aus-health-forecast validate examples/carer-national-sep2026.json
